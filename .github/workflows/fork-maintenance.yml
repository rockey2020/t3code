name: Fork maintenance
run-name: Sync upstream and maintain Chinese desktop builds

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild the current stable and nightly even if already published
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  maintain:
    name: Maintain sources
    concurrency:
      group: fork-maintenance-source
      cancel-in-progress: false
    outputs:
      builds: ${{ steps.prepare.outputs.builds }}
      has_builds: ${{ steps.prepare.outputs.has_builds }}
    if: github.repository == 'rockey2020/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REBUILD: ${{ inputs.rebuild || false }}
      NODE_OPTIONS: --max-old-space-size=4096
      pnpm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Test maintenance release selection
        run: node --test .github/scripts/fork-maintenance.node-test.mjs .github/scripts/fork-signing.node-test.mjs .github/scripts/fork-orchestration.node-test.mjs .github/scripts/fork-release-check.node-test.mjs .github/scripts/fork-watchdog.node-test.mjs scripts/i18n-upstream.node-test.mjs
      - name: Prepare checkout and merge scheduled upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/fork-maintenance.mjs sync
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
      - name: Ensure Electron runtime for focused checks
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Install browser test runtime
        timeout-minutes: 10
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          if [[ -z "$browser" ]]; then echo "Chromium was not installed" >&2; exit 1; fi
          if ldd "$browser" | grep -q 'not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi
      - name: Verify localization exports
        run: node scripts/i18n-export.ts --check
      - name: Scan untranslated strings
        run: node scripts/i18n-untranslated.ts
      - name: Check dependency upgrade transactions
        run: node --test scripts/fork-upgrade-dependencies.node-test.mjs
      - name: Upgrade compatible dependencies and roll back failures
        run: node scripts/fork-upgrade-dependencies.mjs --apply --report fork-dependency-report.json --verify "vp run check:changed --concurrency 1 && vp run build:desktop:bundle"
      - name: Validate changed source before publishing it
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || steps.sync.outputs.original }}
        run: vp run check:changed "$BASE" --concurrency 1
      - name: Publish validated source and prepare tagged builds
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/fork-maintenance.mjs prepare
      - name: Save maintenance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fork-maintenance-reports
          path: |
            fork-dependency-report.json
            fork-maintenance-report.json
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Release ${{ matrix.channel }}
    needs: maintain
    if: ${{ always() && !cancelled() && needs.maintain.outputs.has_builds == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.maintain.outputs.builds || '[]') }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/fork-release.yml
    secrets:
      FORK_MACOS_CERTIFICATE_P12: ${{ secrets.FORK_MACOS_CERTIFICATE_P12 }}
      FORK_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.FORK_MACOS_CERTIFICATE_PASSWORD }}
    with:
      ref: ${{ matrix.ref }}
      version: ${{ matrix.version }}
      tag: ${{ matrix.tag }}
      channel: ${{ matrix.channel }}
      upstream_tag: ${{ matrix.upstream_tag }}
      artifact_namespace: ${{ matrix.artifact_namespace }}
      rebuild: ${{ inputs.rebuild || false }}
